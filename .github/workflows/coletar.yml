name: Coleta e publicação

on:
  schedule:
    # Uma coleta por dia, às 8:50 em Brasília (UTC-3). O cron do GitHub às vezes falha ou atrasa,
    # por isso há novas tentativas até 8:59; a primeira que rodar coleta e as outras pulam.
    - cron: "50 11 * * *"
    - cron: "53 11 * * *"
    - cron: "56 11 * * *"
    - cron: "59 11 * * *"
  workflow_dispatch:           # botão "Run workflow" para coletar na hora
    inputs:
      teste:
        description: 'Teste: coleta e mostra o resultado, sem gravar nem publicar'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se já coletou hoje
        id: hoje
        run: |
          hoje=$(TZ=America/Sao_Paulo date '+%Y-%m-%d')
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ inputs.teste }}" != "true" ] && grep -Eq "\"coletadoEm\": *\"$hoje" dados.json; then
            echo "pular=true" >> "$GITHUB_OUTPUT"; echo "Coleta de $hoje já feita; nada a coletar."
          else
            echo "pular=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar boletins da B3 e calcular as linhas
        if: github.event_name != 'push' && steps.hoje.outputs.pular != 'true'
        shell: pwsh
        run: ./coletar-site.ps1

      - name: Resultado do teste (nada é gravado nem publicado)
        if: inputs.teste
        run: cat dados.json

      - name: Guardar dados no repositório
        if: github.event_name != 'push' && steps.hoje.outputs.pular != 'true' && !inputs.teste
        run: |
          git config user.name "coleta-linhas"
          git config user.email "coleta-linhas@users.noreply.github.com"
          git add dados.json historico.csv dados/b3
          git diff --cached --quiet || git commit -m "Coleta $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.teste }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.teste }}
        with:
          path: .

  publicar:
    needs: coletar
    if: ${{ !inputs.teste }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
